<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animations</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#00ff41;--dg:#0a7a22;--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--g);font-family:"Courier New",Courier,monospace;min-height:100vh}
/* live CRT scanlines: crawling lines + faint flicker + slow rolling refresh band */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,255,65,.04) 0 1px,transparent 1px 3px);animation:crawl 8s linear infinite,flick 5s steps(1) infinite}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:22vh;pointer-events:none;z-index:50;background:linear-gradient(180deg,transparent,rgba(0,255,65,.05) 50%,transparent);animation:roll 9s linear infinite}
@keyframes crawl{to{background-position:0 60px}}
@keyframes roll{from{transform:translateY(-25vh)}to{transform:translateY(105vh)}}
@keyframes flick{0%,100%{opacity:1}30%{opacity:.88}31%{opacity:1}72%{opacity:.8}73%{opacity:.95}74%{opacity:1}}
@media (prefers-reduced-motion:reduce){body::after,body::before{animation:none}}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.15em;text-shadow:0 0 10px var(--g)}
h1::after{content:"_";animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.sub{color:var(--dg);margin:0 0 18px}
.screen{border:1px solid var(--g);box-shadow:0 0 18px rgba(0,255,65,.45);background:#020a04;padding:8px}
.bar{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:2px 2px 8px;flex-wrap:wrap}
.bar a{color:var(--g)}
.frame{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--dg)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
h2{margin:26px 0 12px;font-size:1rem;color:var(--dg)}
.brk{border:0;border-top:1px dashed var(--dg);margin:34px 0 0}
.back-wrap{display:flex;justify-content:center;margin-top:28px}
.back{color:var(--g);border:1px solid var(--g);padding:10px 28px;text-decoration:none;letter-spacing:.15em;text-transform:uppercase;transition:.15s}
.back:hover,.back:focus-visible{background:var(--g);color:#000;box-shadow:0 0 14px var(--g);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.t{background:#000;border:1px solid var(--dg);color:var(--g);font:inherit;text-align:left;padding:0;cursor:pointer;transition:.15s}
.t:hover,.t:focus-visible,.t.on{border-color:var(--g);box-shadow:0 0 12px var(--g);outline:none}
.img{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#031a08 0 8px,#000 8px 16px);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.6) sepia(1) hue-rotate(60deg) saturate(2.5) brightness(.85)}
.t:hover .img img,.t.on .img img{filter:none}
.cap{padding:6px 8px;font-size:.8rem;display:flex;gap:6px}
.cap b{color:var(--dg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Animations</h1>
  <p class="sub">&gt; select a thumbnail to load the stream</p>

  <div class="screen">
    <div class="bar"><span id="now">&gt; loading…</span><a id="yt" href="#" target="_blank" rel="noopener">open on youtube ↗</a></div>
    <div class="frame"><iframe id="player" title="Animation player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  </div>

  <h2>// DethJazz [7]</h2>
  <div class="grid" id="grid1"></div>

  <hr class="brk">

  <h2>// Sword in Stone [4]</h2>
  <div class="grid" id="grid2"></div>

  <hr class="brk">

  <div class="back-wrap"><a class="back" id="back" href="index.html">&lt; back</a></div>
</div>

<script>
const VIDEOS=[
 {id:"qrQZLu6ypqI",t:"Epoch 1"},
 {id:"XCDuoltaJgA",t:"Muons"},
 {id:"a7BrzptuW-Y",t:"Zooted"},
 {id:"UyhCGU7R2lM",t:"Oh sweet tone"},
 {id:"dsjJbZG86QU",t:"planetxanupillarofpills"},
 {id:"v7F8m-PLOLE",t:"S h r e d"},
 {id:"MJH0nvvjyYw",t:"Amped"},
 {id:"a_o7AjDHDAs",t:"S m a u g"},
 {id:"_IJjhvfc_Pc",t:"Thousand SUns"},
 {id:"QfRtNNU8JcA",t:"Blood Wizard"},
 {id:"JHkt_fxEJ98",t:"Immense Buzz"},
];
const grids=[document.getElementById("grid1"),document.getElementById("grid2")],player=document.getElementById("player"),now=document.getElementById("now"),yt=document.getElementById("yt");
function play(i,auto){
  const v=VIDEOS[i];
  player.src="https://www.youtube-nocookie.com/embed/"+v.id+"?rel=0"+(auto?"&autoplay=1":"");
  now.textContent="> now playing: "+v.t.toLowerCase();
  yt.href="https://www.youtube.com/watch?v="+v.id;
  document.querySelectorAll(".t").forEach((c,j)=>c.classList.toggle("on",j===i));
  if(auto)window.scrollTo({top:0,behavior:"smooth"});
}
const thumbs=id=>[
  "https://i.ytimg.com/vi/"+id+"/mqdefault.jpg",
  "https://img.youtube.com/vi/"+id+"/mqdefault.jpg",
  "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"
];
VIDEOS.forEach((v,i)=>{
  const b=document.createElement("button");
  b.className="t";
  b.innerHTML='<div class="img">▶<img alt="" referrerpolicy="no-referrer"></div><div class="cap"><b>'+String(i+1).padStart(2,"0")+'</b><span>'+v.t+'</span></div>';
  const img=b.querySelector("img"),src=thumbs(v.id);let k=0;
  img.onerror=()=>{ if(++k<src.length) img.src=src[k]; else img.remove(); };
  img.src=src[0];
  b.onclick=()=>play(i,true);
  grids[i<7?0:1].appendChild(b);
});
play(0,false);
document.getElementById("back").onclick=e=>{
  if(history.length>1){e.preventDefault();history.back();}
};
</script>
</body>
</html>
