<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNE // NEKRON.ORG FEED</title>
    <!-- Tailwind CSS for utility layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --hacker-green: #00ff41;
            --hacker-dark: #0a0a0a;
            --hacker-glow: rgba(0, 255, 65, 0.3);
        }

        body {
            background-color: #000;
            color: var(--hacker-green);
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Main Container with Bold Green Border */
        .terminal-container {
            width: 100%;
            max-width: 1000px;
            border: 6px solid var(--hacker-green);
            background-color: var(--hacker-dark);
            box-shadow: 0 0 30px var(--hacker-glow);
            padding: 1.5rem;
            position: relative;
            overflow: hidden; /* Ensure grid stays inside */
        }

        /* Grid Background Effect - now constrained to the container */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Scanline animation over the grid */
        .grid-overlay::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Content needs to be above the grid */
        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        .header-section {
            border-bottom: 2px solid var(--hacker-green);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            background: rgba(10, 10, 10, 0.8);
        }

        .glitch-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px var(--hacker-glow);
        }

        /* News Item Styling */
        .feed-item {
            border: 1px solid var(--hacker-green);
            padding: 1rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            background: rgba(0, 20, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        .feed-item:hover {
            background-color: var(--hacker-green);
            color: black;
            box-shadow: 0 0 15px var(--hacker-green);
        }

        .feed-item a {
            color: inherit;
            text-decoration: none;
        }

        .feed-item .meta {
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(0, 255, 65, 0.1);
            border-left: 4px solid var(--hacker-green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .terminal-container {
                border-width: 3px;
                padding: 1rem;
            }
            .glitch-text {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- The grid is now inside the container -->
        <div class="grid-overlay"></div>

        <div class="content-wrapper">
            <div class="header-section">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 text-xs">
                    <span>LOCAL_HOST: nekron.org</span>
                    <span>DATA_STREAM: [DUNE_EXPERIMENT]</span>
                    <span id="system-time"></span>
                </div>
                <h1 class="glitch-text text-2xl md:text-4xl">> DEEP UNDERGROUND NEUTRINO EXPERIMENT</h1>
                <p class="mt-2 text-sm opacity-70">Detecting ghost particles 1,480 meters underground.</p>
            </div>

            <div id="status-msg" class="mb-4 text-sm animate-pulse">Initializing decryption protocols...</div>

            <div id="rss-feed" class="space-y-4">
                <!-- Loading state -->
                <div class="flex flex-col items-center justify-center py-20">
                    <div class="loader mb-4"></div>
                    <p>UPLINKING TO FERMILAB...</p>
                </div>
            </div>

            <div class="footer mt-10 pt-4 border-t border-green-900 text-center text-xs opacity-50">
                SYSTEM END / AUTH: NEKRON_ADMIN
            </div>
        </div>
    </div>

    <script>
        // System Time Update
        function updateTime() {
            const now = new Date();
            document.getElementById('system-time').innerText = `TIMESTAMP: ${now.toISOString()}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        const DUNE_FEED_URL = "https://news.fnal.gov/tag/dune/feed/";

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Turn raw RSS/Atom XML into the same item shape rss2json returns
        function parseFeedXml(text) {
            const xml = new DOMParser().parseFromString(text, 'text/xml');
            return Array.from(xml.querySelectorAll('item, entry')).map(el => {
                const txt = sel => (el.querySelector(sel)?.textContent || '').trim();
                const linkEl = el.querySelector('link');
                return {
                    title: txt('title'),
                    link: (linkEl && (linkEl.getAttribute('href') || linkEl.textContent.trim())) || '',
                    pubDate: txt('pubDate') || txt('published') || txt('updated'),
                    description: txt('description') || txt('summary'),
                    author: (el.getElementsByTagName('dc:creator')[0]?.textContent || '').trim()
                };
            });
        }

        // Route 0: our own server (feed.php) -> Route 1: rss2json -> Route 2+: public proxies
        async function fetchFeedItems() {
            try {
                const r = await fetch('/feed.php?src=dune');
                if (r.ok) {
                    const items = parseFeedXml(await r.text());
                    if (items.length) return items;
                }
                console.warn('feed.php returned nothing usable:', r.status);
            } catch (e) { console.warn('feed.php failed:', e); }

            try {
                const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(DUNE_FEED_URL));
                const d = await r.json();
                if (d.status === 'ok' && d.items && d.items.length) return d.items;
                console.warn('rss2json:', d.message || d.status);
            } catch (e) { console.warn('rss2json failed:', e); }

            const proxies = [
                u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
                u => 'https://corsproxy.io/?' + encodeURIComponent(u)
            ];
            for (const makeUrl of proxies) {
                try {
                    const r = await fetch(makeUrl(DUNE_FEED_URL));
                    if (!r.ok) continue;
                    const items = parseFeedXml(await r.text());
                    if (items.length) return items;
                } catch (e) { console.warn('proxy failed:', e); }
            }
            throw new Error('all feed routes failed');
        }

        let retries = 0;

        async function loadFeed() {
            const feedContainer = document.getElementById('rss-feed');
            const statusMsg = document.getElementById('status-msg');

            try {
                const items = await fetchFeedItems();
                feedContainer.innerHTML = '';

                // Limit the number of articles to 5 for a shorter feed height
                const itemsToShow = items.slice(0, 5);

                statusMsg.classList.remove('animate-pulse');
                statusMsg.innerText = `>> SUCCESS: ${itemsToShow.length} PACKETS RECEIVED FROM DUNE_SOURCE`;

                itemsToShow.forEach(item => {
                    const article = document.createElement('div');
                    article.className = 'feed-item group';

                    const pubDate = new Date(item.pubDate).toLocaleDateString(undefined, {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });

                    const snippet = (item.description || '').replace(/<[^>]*>?/gm, '').trim().substring(0, 180) + "...";

                    article.innerHTML = `
                        <div class="meta">
                            [ID: 0x${Math.floor(Math.random() * 16777215).toString(16)}] 
                            [DATE: ${pubDate}] 
                            [BY: ${escapeHtml(item.author || 'FERMILAB')}]
                        </div>
                        <h2 class="text-xl font-bold mb-2">
                            <a href="${escapeHtml(item.link)}" target="_blank"> ${escapeHtml(item.title)}</a>
                        </h2>
                        <p class="text-sm leading-relaxed opacity-90">${escapeHtml(snippet)}</p>
                        <div class="mt-4 text-xs font-bold underline">READ_FULL_LOG -></div>
                    `;

                    article.onclick = () => window.open(item.link, '_blank');
                    feedContainer.appendChild(article);
                });
            } catch (error) {
                console.error('Feed error:', error);
                const willRetry = retries < 3;
                statusMsg.innerText = willRetry
                    ? ">> ERROR: UPLINK FAILED. RETRYING IN 30s..."
                    : ">> ERROR: UPLINK FAILED.";
                feedContainer.innerHTML = `
                    <div class="border border-red-500 p-6 text-red-500 bg-red-900 bg-opacity-10">
                        <h3 class="font-bold">> CONNECTION_TIMEOUT</h3>
                        <p class="mt-2 text-sm">The secure handshake with Fermilab news servers failed.</p>
                        <button onclick="location.reload()" class="mt-4 border border-red-500 px-4 py-2 hover:bg-red-500 hover:text-black transition-colors">
                            RE-ESTABLISH UPLINK
                        </button>
                    </div>
                `;
                if (willRetry) { retries++; setTimeout(loadFeed, 30000); }
            }
        }

        window.onload = loadFeed;
    </script>
</body>
</html>
